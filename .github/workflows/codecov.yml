name: codecov
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 2
      - uses: actions/setup-go@master
        with:
          go-version: "1.24"
      - name: Run build
        run: go build ./...
      - name: Run test with coverage
        run: go test -tags=skiptest -v ./... -coverprofile=coverage.txt -covermode=atomic -timeout 10s
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          fail_ci_if_error: false
